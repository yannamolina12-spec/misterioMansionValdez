<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>El Misterio de la Mansión Valdez</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        body {
            background: #080812;
            font-family: 'Courier New', Courier, monospace;
            color: #f0e6d2;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative; width: 100vw; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            background: #000;
            max-width: 95vw; max-height: 60dvh;
            aspect-ratio: 4 / 3;
            border: 4px solid #4a3420;
            outline: 2px solid #ffcc00;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            z-index: 1;
        }
        #hud {
            position: absolute; top: 10px; left: 0; right: 0;
            padding: 0 15px; display: flex; justify-content: space-between;
            pointer-events: none; z-index: 10;
        }
        .hud-item {
            background: rgba(20, 10, 30, 0.9);
            padding: 6px 12px; border: 1px solid #ffcc00;
            border-radius: 2px; font-size: 11px; color: #ffcc00;
            box-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #touch-controls {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 20; pointer-events: none;
        }
        #dpad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 8px; pointer-events: auto; }
        .dpad-btn {
            width: 55px; height: 55px; background: #3a2a1a;
            border: 2px solid #ffcc00; color: #ffcc00; font-size: 22px;
            border-radius: 6px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 0 #1a1005;
        }
        .dpad-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; background: #5a4a3a; }
        .dpad-u { grid-area: u; } .dpad-d { grid-area: d; } .dpad-l { grid-area: l; } .dpad-r { grid-area: r; }
        #action-btn {
            width: 75px; height: 75px; background: #a00000;
            border: 3px solid #ffcc00; color: #fff; border-radius: 50%;
            font-weight: bold; pointer-events: auto; box-shadow: 0 5px 0 #500;
            text-shadow: 1px 1px 2px #000;
        }
        #action-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        .overlay {
            position: absolute; inset: 0; background: rgba(5, 5, 15, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; padding: 25px; text-align: center; border: 6px double #ffcc00; margin: 15px;
        }
        .overlay h1 { color: #ffcc00; font-size: 24px; margin-bottom: 15px; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
        .story { font-size: 13px; line-height: 1.5; margin-bottom: 25px; max-width: 450px; color: #d0d0d0; }
        button.menu-btn {
            background: #4a3420; color: #ffcc00; border: 2px solid #ffcc00;
            padding: 12px 24px; font-family: inherit; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        button.menu-btn:hover { background: #ffcc00; color: #20150a; }
        #dialog-box {
            position: absolute; bottom: 170px; left: 15px; right: 15px;
            background: #150a20; border: 2px solid #ffcc00; padding: 15px;
            z-index: 50; max-width: 550px; margin: 0 auto; box-shadow: 0 8px 25px #000;
        }
        #dialog-text { font-size: 14px; line-height: 1.4; color: #fff; }
        .hidden { display: none !important; }
        #puzzle-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center; z-index: 150;
        }
        .puzzle-box { background: #2a150a; border: 4px solid #ffcc00; padding: 30px; text-align: center; box-shadow: 0 0 40px #ffcc0044; }
        .puzzle-input { 
            width: 150px; background: #000; border: 2px solid #ffcc00; 
            color: #ffcc00; font-size: 28px; text-align: center; margin: 15px; padding: 8px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div id="location" class="hud-item">📍 Mansión Valdez</div>
            <div id="inventory" class="hud-item">🎒 Vacío</div>
        </div>

        <canvas id="game" width="640" height="480"></canvas>

        <div id="touch-controls" class="hidden">
            <div id="dpad">
                <button class="dpad-btn dpad-u" data-dir="up">▲</button>
                <button class="dpad-btn dpad-l" data-dir="left">◀</button>
                <button class="dpad-btn dpad-r" data-dir="right">▶</button>
                <button class="dpad-btn dpad-d" data-dir="down">▼</button>
            </div>
            <button id="action-btn">ACC</button>
        </div>

        <div id="dialog-box" class="hidden">
            <p id="dialog-text"></p>
            <p style="font-size:10px; color:#ffcc00; text-align:right; margin-top:8px; font-weight:bold;">[Toca para continuar]</p>
        </div>

        <div id="start-screen" class="overlay">
            <h1>LA TRAICIÓN DE VALDEZ</h1>
            <p class="story">
                El Sr. Valdez no murió por causas naturales. La "Lágrima de Sangre" oculta un secreto dinástico. <br><br>
                Investiga la escena, conecta las mentiras y recupera el honor de la familia.
            </p>
            <button id="start-btn" class="menu-btn">INICIAR INVESTIGACIÓN</button>
            <button id="audio-toggle" class="menu-btn" style="margin-top:12px; font-size:11px;">🔊 SONIDO: ACTIVADO</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h1>VERDAD REVELADA</h1>
            <p id="end-text" class="story"></p>
            <button class="menu-btn" onclick="location.reload()">CASO NUEVO</button>
        </div>

        <div id="puzzle-overlay" class="hidden">
            <div class="puzzle-box">
                <h2 id="p-title" style="color:#ffcc00; font-size:18px;"></h2>
                <p id="p-desc" style="font-size:13px; margin:15px 0; color:#d0d0d0;"></p>
                <input type="text" id="p-input" class="puzzle-input" maxlength="6">
                <div style="display:flex; gap:15px; justify-content:center;">
                    <button id="p-check" class="menu-btn">DESCIFRAR</button>
                    <button id="p-cancel" class="menu-btn" style="background:#222;">CERRAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx = null;
        let masterGain = null;
        let isMuted = false;
        let audioInitialized = false;

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.12;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (!audioInitialized) {
                setInterval(() => {
                    if(game.state === 'playing' && !isMuted) playNote(90 + Math.random() * 5, 2, 'triangle', 0.06);
                }, 2500);
                setInterval(() => {
                    if(game.state === 'playing' && !isMuted && Math.random() > 0.7) playNote(550 + Math.random() * 150, 0.15, 'sine', 0.03);
                }, 900);
                audioInitialized = true;
            }
        }

        function playNote(freq, dur, type = 'sine', vol = 0.2) {
            if (!audioCtx || isMuted || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(g);
            g.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function playVictorySound() {
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((f, i) => setTimeout(() => playNote(f, 0.8, 'sine', 0.3), i * 180));
        }

        // --- GAME LOGIC ---
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const audioToggle = document.getElementById('audio-toggle');
        const actionBtn = document.getElementById('action-btn');
        
        const game = {
            state: 'menu',
            currentRoom: 'entrada',
            inventory: [],
            flags: { nota: false, llave: false, pistaReloj: false, pistaCuadro: false, pistaLibro: false, animFrame: 0 },
            isMoving: false
        };

        const player = { x: 320, y: 400, w: 20, h: 30, speed: 2.8, dir: 'up', anim: 0 };
        const keys = { up: false, down: false, left: false, right: false };

        const rooms = {
            entrada: {
                name: 'Vestíbulo Majestuoso', floor: '#2a1a10', wall: '#150a05',
                objects: [
                    { id: 'armadura', x: 80, y: 110, w: 40, h: 60, label: 'Guardia de Acero', action: 'lookArmor' },
                    { id: 'chimenea', x: 260, y: 70, w: 120, h: 80, label: 'Fuego Agónico', action: 'lookFire' },
                    { id: 'alfombra', x: 240, y: 300, w: 160, h: 100, label: 'Alfombra Persa', action: 'checkRug' },
                    { id: 'puertaBib', x: 580, y: 180, w: 40, h: 100, label: 'Biblioteca', action: 'enterBib' }
                ]
            },
            biblioteca: {
                name: 'Archivo del Silencio', floor: '#3d2516', wall: '#1a0d06',
                objects: [
                    { id: 'estante1', x: 60, y: 100, w: 100, h: 40, label: 'Títulos Prohibidos', action: 'readHist' },
                    { id: 'reloj', x: 300, y: 80, w: 40, h: 80, label: 'Reloj del Juicio', action: 'lookClock' },
                    { id: 'escritorio', x: 450, y: 300, w: 100, h: 60, label: 'Mesa de Trabajo', action: 'checkDesk' },
                    { id: 'puertaEnt', x: 20, y: 180, w: 40, h: 100, label: 'Volver', action: 'enterEnt' },
                    { id: 'puertaEst', x: 580, y: 180, w: 40, h: 100, label: 'Estudio de Arte', action: 'enterEst' }
                ]
            },
            estudio: {
                name: 'Sanctum del Artista', floor: '#2e0f0f', wall: '#0f0505',
                objects: [
                    { id: 'cuadro', x: 240, y: 80, w: 160, h: 100, label: 'El Último Retrato', action: 'lookPortrait' },
                    { id: 'cajafuerte', x: 500, y: 120, w: 60, h: 60, label: 'Cofre de la Verdad', action: 'solveSafe' },
                    { id: 'puertaBib2', x: 20, y: 180, w: 40, h: 100, label: 'Regresar', action: 'enterBibFromEst' }
                ]
            }
        };

        function draw() {
            const room = rooms[game.currentRoom];
            
            // Floor with richer color
            ctx.fillStyle = room.floor;
            ctx.fillRect(0, 0, 640, 480);
            
            // Walls with deep shadow
            ctx.fillStyle = room.wall;
            ctx.fillRect(0, 0, 640, 120); 
            ctx.fillRect(0, 0, 45, 480);   
            ctx.fillRect(595, 0, 45, 480); 

            // Objects with vibrant accents
            room.objects.forEach(o => {
                ctx.fillStyle = '#5c3d2e';
                if(o.id === 'chimenea') ctx.fillStyle = '#b32400'; // Brighter fire glow
                if(o.id === 'alfombra') ctx.fillStyle = '#800000'; // Deep crimson
                
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeStyle = '#ffcc00'; // Gold outline
                ctx.lineWidth = 2;
                ctx.strokeRect(o.x, o.y, o.w, o.h);

                const dist = Math.hypot(player.x - (o.x + o.w/2), player.y - (o.y + o.h/2));
                if(dist < 65 && game.state === 'playing') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 13px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(o.label, o.x + o.w/2, o.y - 12);
                }
            });

            // Player Animation Improvements (Slight bobbing and dynamic shapes)
            const bob = game.isMoving ? Math.sin(Date.now() / 80) * 3 : 0;
            const tilt = game.isMoving ? Math.sin(Date.now() / 100) * 0.05 : 0;

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(tilt);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 15, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Piel (con bobbing)
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(-10, -30 + bob, 20, 12);
            
            // Ropa (Vibrant Navy Blue)
            ctx.fillStyle = '#1a1a4d';
            ctx.fillRect(-12, -20 + bob, 24, 20);
            
            // Pelo (Vibrant Black with highlight)
            ctx.fillStyle = '#000';
            ctx.fillRect(-15, -34 + bob, 30, 6);
            ctx.fillStyle = '#333';
            ctx.fillRect(-12, -34 + bob, 8, 2);

            ctx.restore();

            // Flashlight Effect (Slightly warmer/vibrant)
            const grad = ctx.createRadialGradient(player.x, player.y - 15, 25, player.x, player.y - 15, 190);
            grad.addColorStop(0, 'rgba(255, 240, 200, 0.05)');
            grad.addColorStop(0.5, 'rgba(0,0,0,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0.97)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 640, 480);
        }

        function update() {
            if(game.state !== 'playing') return;
            let moveX = 0, moveY = 0;
            game.isMoving = false;

            if(keys.up) moveY = -player.speed;
            if(keys.down) moveY = player.speed;
            if(keys.left) moveX = -player.speed;
            if(keys.right) moveX = player.speed;

            if (moveX !== 0 || moveY !== 0) game.isMoving = true;

            const nextX = player.x + moveX;
            const nextY = player.y + moveY;
            if(nextX > 60 && nextX < 580) player.x = nextX;
            if(nextY > 140 && nextY < 450) player.y = nextY;
        }

        function handleAction() {
            if(game.state === 'dialog') { closeDialog(); return; }
            if(game.state !== 'playing') return;

            const room = rooms[game.currentRoom];
            const obj = room.objects.find(o => Math.hypot(player.x - (o.x + o.w/2), player.y - (o.y + o.h/2)) < 65);
            if(!obj) return;
            
            playNote(220, 0.05);

            switch(obj.action) {
                case 'lookArmor': 
                    showDialog(["Un centinela mudo.", "Nota pegada en el peto: 'La ambición de Valdez era tan grande como su colección de 9 libros rojos'."]); 
                    game.flags.pistaLibro = true;
                    break;
                case 'lookFire': 
                    showDialog(["El fuego consume una carta confidencial.", "Distingues: 'El traidor siempre mira al SUR cuando la verdad está en el NORTE'."]); 
                    game.flags.nota = true; 
                    break;
                case 'checkRug': 
                    if(game.flags.nota && !game.flags.llave) {
                        showDialog(["¡Bingo! Una llave dorada escondida en las fibras.", "Obtienes: LLAVE DE LA BIBLIOTECA."]);
                        game.inventory.push("Llave Maestra");
                        game.flags.llave = true;
                        updateHUD();
                        playNote(880, 0.2);
                    } else showDialog(["La alfombra tiene manchas de cera roja."]);
                    break;
                case 'enterBib': 
                    if(game.flags.llave) { game.currentRoom = 'biblioteca'; player.x = 80; updateHUD(); } 
                    else showDialog(["Necesitas la llave del Vestíbulo."]);
                    break;
                case 'readHist': 
                    showDialog(["La sección de historia tiene 9 tomos rojos.", "Falta el volumen 3. Alguien lo robó recientemente."]); 
                    break;
                case 'lookClock': 
                    showDialog(["El reloj marca exactamente las 12:00.", "Nota críptica: 'El segundo dígito es el punto cardinal OPUESTO al que marca la hora (Norte=12, Sur=6, Este=3, Oeste=9)'."]); 
                    game.flags.pistaReloj = true; 
                    break;
                case 'checkDesk': 
                    showDialog(["Documentos bancarios. Valdez tenía una deuda de 4 millones con su sobrino.", "El sobrino nació un día 4."]); 
                    break;
                case 'enterEnt': game.currentRoom = 'entrada'; player.x = 550; updateHUD(); break;
                case 'enterEst': 
                    if(game.flags.pistaReloj && game.flags.pistaLibro) { game.currentRoom = 'estudio'; player.x = 80; updateHUD(); } 
                    else showDialog(["La puerta del estudio tiene un sensor de movimiento que no has desactivado."]);
                    break;
                case 'lookPortrait': 
                    showDialog(["Sr. Valdez. En su mano sostiene un bastón con 4 rubíes.", "El testamento está firmado con este mismo número."]); 
                    game.flags.pistaCuadro = true; 
                    break;
                case 'solveSafe': 
                    // TRAMA Y LÓGICA:
                    // 1. Libros rojos = 9.
                    // 2. Reloj marca las 12 (Norte). El opuesto es el 6 (Sur).
                    // 3. Bastón/Día de nacimiento sobrino = 4.
                    // CODIGO: 964
                    openPuzzle("COFRE DE LA VERDAD", "Código Imperial de 3 niveles.", "Libros | Opuesto al Norte | Rubíes", "964"); 
                    break;
                case 'enterBibFromEst': game.currentRoom = 'biblioteca'; player.x = 550; updateHUD(); break;
            }
        }

        // --- UI UTILS ---
        function showDialog(lines) {
            game.state = 'dialog';
            document.getElementById('dialog-box').classList.remove('hidden');
            document.getElementById('dialog-text').textContent = lines.join(' ');
        }
        function closeDialog() { game.state = 'playing'; document.getElementById('dialog-box').classList.add('hidden'); }
        function updateHUD() {
            document.getElementById('location').textContent = '📍 ' + rooms[game.currentRoom].name;
            document.getElementById('inventory').textContent = '🎒 ' + (game.inventory.length ? game.inventory.join(', ') : 'Vacío');
        }

        function openPuzzle(title, desc, hint, ans) {
            game.state = 'puzzle';
            currentAnswer = ans;
            document.getElementById('puzzle-overlay').classList.remove('hidden');
            document.getElementById('p-title').textContent = title;
            document.getElementById('p-desc').textContent = desc + " (" + hint + ")";
            document.getElementById('p-input').value = "";
            document.getElementById('p-input').focus();
        }

        let currentAnswer = "";
        document.getElementById('p-check').onclick = () => {
            if(document.getElementById('p-input').value === currentAnswer) {
                document.getElementById('puzzle-overlay').classList.add('hidden');
                game.state = 'end';
                playVictorySound();
                document.getElementById('end-screen').classList.remove('hidden');
                document.getElementById('end-text').innerHTML = "¡CONFESIÓN ENCONTRADA! <br><br> El sobrino manipuló el reloj para heredar antes. Valdez fue envenenado con la 'Lágrima'. <br><br> Has salvado el legado Valdez.";
            } else {
                playNote(80, 0.5, 'square', 0.2);
                document.getElementById('p-input').style.borderColor = '#ff0000';
                setTimeout(()=> document.getElementById('p-input').style.borderColor = '#ffcc00', 600);
            }
        };
        document.getElementById('p-cancel').onclick = () => { document.getElementById('puzzle-overlay').classList.add('hidden'); game.state = 'playing'; };

        // --- INPUTS ---
        startBtn.onclick = async () => {
            await initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');
            game.state = 'playing';
            updateHUD();
        };

        audioToggle.onclick = async () => {
            if(!audioCtx) await initAudio();
            isMuted = !isMuted;
            audioToggle.textContent = isMuted ? '🔇 SONIDO: DESACTIVADO' : '🔊 SONIDO: ACTIVADO';
        };

        window.onkeydown = e => {
            if(e.key.includes('Arrow')) keys[e.key.replace('Arrow','').toLowerCase()] = true;
            if(e.key === 'w') keys.up = true; if(e.key === 's') keys.down = true;
            if(e.key === 'a') keys.left = true; if(e.key === 'd') keys.right = true;
            if(e.key === 'e' || e.key === ' ') handleAction();
        };
        window.onkeyup = e => {
            if(e.key.includes('Arrow')) keys[e.key.replace('Arrow','').toLowerCase()] = false;
            if(e.key === 'w') keys.up = false; if(e.key === 's') keys.down = false;
            if(e.key === 'a') keys.left = false; if(e.key === 'd') keys.right = false;
        };

        document.querySelectorAll('.dpad-btn').forEach(b => {
            b.onpointerdown = e => { e.preventDefault(); keys[b.dataset.dir] = true; };
            b.onpointerup = e => { e.preventDefault(); keys[b.dataset.dir] = false; };
            b.onpointerleave = e => { keys[b.dataset.dir] = false; };
        });
        actionBtn.onpointerdown = e => { e.preventDefault(); handleAction(); };

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
